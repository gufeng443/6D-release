  <rect x="952" y="556" width="178" height="44" rx="6" fill="#a94e31"/>
  <text x="1041" y="584" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="15" font-weight="700" fill="#ffffff">批量同步</text>
