  <rect x="56" y="44" width="1128" height="772" rx="8" fill="#ffffff" stroke="#bdc8c3"/>
  <rect x="56" y="44" width="1128" height="76" rx="8" fill="#17201d"/>
  <rect x="56" y="112" width="1128" height="8" fill="#17201d"/>

  <rect x="84" y="64" width="38" height="38" rx="6" fill="#176b50"/>
